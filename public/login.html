<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Manna</title>
<link rel="stylesheet" href="/css/auth.css?v=2">
</head>
<body>
<div class="card auth-center">
  <div class="brand"><img src="/manna-logo.webp" alt="Manna" class="brand-logo"></div>
  <div class="tagline">Big agency data, little guy money.</div>
  <div class="kicker">Welcome back</div>
  <h1>Log in</h1>
  <p class="sub">Welcome back to your marketing command center.</p>
  <div class="error" id="err"></div>
  <form id="login-form" autocomplete="on">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <button class="primary" type="submit" id="submit">Log in</button>
  </form>
  <div class="links">
    <a href="/forgot">Forgot password?</a>
    <a href="/signup">Create account</a>
  </div>
<div class="legal-footer"><a href="/terms">Terms</a><span aria-hidden="true">·</span><a href="/privacy">Privacy</a></div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
