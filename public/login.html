<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="auth.login.meta_title">Log in — Manna</title>
<link rel="stylesheet" href="/css/auth.css?v=2">
</head>
<body>
<div class="card auth-center">
  <div style="text-align:right;margin-bottom:4px"><select data-lang-picker aria-label="Language" style="font-size:12px;padding:4px 8px;border-radius:6px;background:#14141c;color:#e8e6df;border:1px solid #33333f;cursor:pointer"></select></div>
  <div class="brand"><img src="/manna-logo.webp" alt="Manna" class="brand-logo"></div>
  <div data-i18n="auth.shared.tagline" class="tagline">Big agency data, little guy money.</div>
  <div data-i18n="auth.login.kicker" class="kicker">Welcome back</div>
  <h1 data-i18n="auth.login.title">Log in</h1>
  <p data-i18n="auth.login.sub" class="sub">Welcome back to your marketing command center.</p>
  <div class="error" id="err"></div>
  <form id="login-form" autocomplete="on">
    <label data-i18n="auth.shared.label_email" for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="username">
    <label data-i18n="auth.shared.label_password" for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <button data-i18n="auth.login.submit" class="primary" type="submit" id="submit">Log in</button>
  </form>
  <div class="links">
    <a data-i18n="auth.login.forgot_link" href="/forgot">Forgot password?</a>
    <a data-i18n="auth.login.create_account" href="/signup">Create account</a>
  </div>
<div class="legal-footer"><a data-i18n="auth.shared.link_terms" href="/terms">Terms</a><span aria-hidden="true">·</span><a data-i18n="auth.shared.link_privacy" href="/privacy">Privacy</a></div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>
<script src="/js/i18n.js"></script>
</body>
</html>
