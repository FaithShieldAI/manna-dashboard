<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set new password — Manna</title>
<link rel="stylesheet" href="/css/auth.css?v=2">
</head>
<body>
<div class="card">
  <div class="brand"><img src="/manna-logo.webp" alt="Manna" class="brand-logo"></div>
  <div class="tagline">Big agency data, little guy money.</div>
  <h1>New password</h1>
  <p class="sub">Your reset link is valid for 1 hour and can only be used once.</p>
  <div class="error" id="err"></div>
  <div class="success" id="ok"></div>
  <form id="reset-form">
    <label for="password">New password</label>
    <input type="password" id="password" required autocomplete="new-password" minlength="12">
    <p class="hint">At least 12 characters.</p>
    <label for="password2">Confirm new password</label>
    <input type="password" id="password2" required autocomplete="new-password" minlength="12">
    <button class="primary" type="submit" id="submit">Set new password</button>
  </form>
  <div class="links"><a href="/login">Back to log in</a></div>
<div class="legal-footer"><a href="/terms">Terms</a><span aria-hidden="true">·</span><a href="/privacy">Privacy</a></div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/reset.js"></script>
</body>
</html>
