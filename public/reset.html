<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="auth.reset.meta_title">Set new password — Manna</title>
<link rel="stylesheet" href="/css/auth.css?v=2">
</head>
<body>
<div class="card">
      <div style="text-align:right;margin-bottom:4px"><select data-lang-picker aria-label="Language" style="font-size:12px;padding:4px 8px;border-radius:6px;background:#14141c;color:#e8e6df;border:1px solid #33333f;cursor:pointer"></select></div>
  <div class="brand"><img src="/manna-logo.webp" alt="Manna" class="brand-logo"></div>
  <div data-i18n="auth.shared.tagline" class="tagline">Big agency data, little guy money.</div>
  <h1 data-i18n="auth.reset.title">New password</h1>
  <p data-i18n="auth.reset.sub" class="sub">Your reset link is valid for 1 hour and can only be used once.</p>
  <div class="error" id="err"></div>
  <div class="success" id="ok"></div>
  <form id="reset-form">
    <label data-i18n="auth.reset.label_new_password" for="password">New password</label>
    <input type="password" id="password" required autocomplete="new-password" minlength="12">
    <p data-i18n="auth.shared.hint_password" class="hint">At least 12 characters.</p>
    <label data-i18n="auth.reset.label_confirm_password" for="password2">Confirm new password</label>
    <input type="password" id="password2" required autocomplete="new-password" minlength="12">
    <button data-i18n="auth.reset.submit" class="primary" type="submit" id="submit">Set new password</button>
  </form>
  <div class="links"><a data-i18n="auth.shared.link_back_login" href="/login">Back to log in</a></div>
<div class="legal-footer"><a data-i18n="auth.shared.link_terms" href="/terms">Terms</a><span aria-hidden="true">·</span><a data-i18n="auth.shared.link_privacy" href="/privacy">Privacy</a></div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/reset.js"></script>
<script src="/js/i18n.js"></script>
</body>
</html>
