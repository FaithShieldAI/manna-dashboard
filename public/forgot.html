<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password — D2RM Dashboard</title>
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="card">
  <div class="brand"><div class="logo"><span class="d2">D2</span><span class="rm">RM</span></div></div>
  <div class="tagline">Big agency data, little guy money.</div>
  <h1>Reset password</h1>
  <p class="sub">Enter your account email and we'll send you a reset link.</p>
  <div class="error" id="err"></div>
  <div class="success" id="ok"></div>
  <form id="forgot-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">
    <button class="primary" type="submit" id="submit">Send reset link</button>
  </form>
  <div class="links"><a href="/login">Back to log in</a></div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/forgot.js"></script>
</body>
</html>
